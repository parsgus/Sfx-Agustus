<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">

<!-- Open Graph -->
<meta property="og:title" content="Parsgus">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Parsgus">
<meta name="twitter:description" content="Website sedang dalam perawatan, bakal balik lagi sebentar lagi">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 24px;
    text-align: center;
  }

  .logo {
    background: #ffffff;
    border-radius: 16px;
    padding: 14px 28px;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.15);
    margin-bottom: 10px;
  }

  .logo span {
    font-family: 'Pacifico', cursive;
    font-size: 28px;
    color: #111;
  }

  .glow-box {
    width: 320px;
    border: 0.5px solid #ffffff;
    border-radius: 20px;
    padding: 40px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow:
      0 0 2px rgba(255, 255, 255, 0.5),
      0 0 5px rgba(255, 255, 255, 0.25);
    animation: driftBox 14s ease-in-out infinite;
  }

  @keyframes driftBox {
    0%   { transform: translate(0px, 0px); }
    20%  { transform: translate(6px, -4px); }
    40%  { transform: translate(-5px, 5px); }
    60%  { transform: translate(4px, 6px); }
    80%  { transform: translate(-6px, -3px); }
    100% { transform: translate(0px, 0px); }
  }

  .icon {
    font-size: 42px;
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .glow-box h1 {
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow:
      0 0 3px rgba(255, 255, 255, 0.8),
      0 0 8px rgba(255, 255, 255, 0.4);
  }

  .glow-box p {
    color: #b3b3b3;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.7;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>

  <div class="wrapper">
    <div class="logo"><span>Parsgus</span></div>

    <div class="glow-box">
      <div class="icon">⚙️</div>
      <h1>Website Sedang Perawatan</h1>
      <p>sabar Wook, member Σ tahun depan ku kasih 😹😹🤘🌹</p>
    </div>
  </div>

</body>
</html>

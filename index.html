<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  button, a {
    -webkit-tap-highlight-color: transparent;
    outline: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background: linear-gradient(180deg, #5a5a5a 0%, #2b2b2b 45%, #0a0a0a 100%);
    min-height: 100vh;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    justify-content: flex-end;
    padding: 26px 26px 0 26px;
  }

  /* ===== TELEGRAM BUTTON ===== */
  .telegram-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;

    background: linear-gradient(155deg, rgba(90,90,90,0.55) 0%, rgba(15,15,15,0.9) 60%, rgba(0,0,0,0.95) 100%);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.3),
      inset 0 -6px 12px rgba(0, 0, 0, 0.5),
      0 4px 10px rgba(0, 0, 0, 0.4);

    transition: transform 0.15s ease;
  }

  .telegram-btn:active {
    transform: scale(0.93);
  }

  .telegram-btn svg {
    width: 20px;
    height: 20px;
    fill: rgba(210, 210, 210, 0.9);
  }

  .telegram-btn span {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: rgba(210, 210, 210, 0.9);
  }

  /* ===== TITLE (real glass text) ===== */
  .title-wrap {
    text-align: center;
    padding: 10px 20px 0 20px;
    position: relative;
  }

  .title-glow {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 220px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 70%);
    filter: blur(10px);
    pointer-events: none;
    z-index: 0;
  }

  .title-wrap h1 {
    position: relative;
    z-index: 1;
    font-family: 'Baloo 2', 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 54px;
    line-height: 1.1;
    letter-spacing: 1px;

    color: rgba(160, 160, 160, 0.55);

    -webkit-text-stroke: 0.5px rgba(255,255,255,0.35);
    filter: drop-shadow(1px 1px 1px rgba(255,255,255,0.25)) drop-shadow(-1px -1px 2px rgba(0,0,0,0.5));
  }

  /* ===== MAIN CONTENT ===== */
  .main-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    min-height: calc(100vh - 230px);
    padding: 50px 24px 40px 24px;
  }

  /* ===== GLASS BUTTON ===== */
  .glass-btn {
    position: relative;
    width: 100%;
    max-width: 360px;
    min-height: 190px;
    border-radius: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    border: none;
    padding: 20px;

    background: linear-gradient(155deg, rgba(90,90,90,0.55) 0%, rgba(15,15,15,0.9) 55%, rgba(0,0,0,0.95) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow:
      inset 0 2px 2px rgba(255, 255, 255, 0.3),
      inset 0 -14px 26px rgba(0, 0, 0, 0.55),
      inset 14px 0 24px rgba(0, 0, 0, 0.25),
      inset -14px 0 24px rgba(0, 0, 0, 0.25),
      0 10px 24px rgba(0, 0, 0, 0.5);

    transition: transform 0.15s ease;
    transform: translateY(var(--scroll-ty, 0px)) scale(var(--btn-scale, 1));
  }

  .glass-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(
      100deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.18) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: skewX(-20deg);
    animation: shine 6s ease-in-out infinite;
  }

  @keyframes shine {
    0%   { left: -60%; }
    30%  { left: 130%; }
    100% { left: 130%; }
  }

  .glass-btn:active {
    --btn-scale: 0.95;
  }

  .glass-btn.animate-scroll {
    transition: transform 0.6s ease, opacity 0.6s ease;
    will-change: transform, opacity;
    opacity: 1;
  }

  .glass-btn.scrolled-out {
    --scroll-ty: -140px;
    opacity: 0.35;
  }

  .glass-btn.scrolled-in {
    --scroll-ty: 0px;
    opacity: 1;
  }

  .scroll-spacer {
    height: 90vh;
  }

  .glass-btn span {
    position: relative;
    z-index: 2;
    font-family: 'Baloo 2', 'Poppins', sans-serif;
    font-weight: 700;
    font-style: italic;
    font-size: 26px;
    color: rgba(140, 140, 140, 0.5);
    text-shadow:
      1px 1px 1px rgba(255, 255, 255, 0.3),
      -1px -1px 2px rgba(0, 0, 0, 0.7);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <a href="https://t.me/parsgus" class="telegram-btn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M21.94 2.94c-.32-.24-.75-.29-1.12-.13L2.4 10.4c-.42.17-.68.6-.65 1.06.03.46.35.84.8.95l4.72 1.18 1.83 5.92c.12.4.47.68.89.72.05 0 .1.01.14.01.36 0 .7-.18.9-.49l2.6-3.94 4.86 3.6c.18.13.4.2.61.2.14 0 .28-.03.41-.09.35-.15.6-.47.65-.85L23.98 3.9c.06-.4-.1-.78-.42-1z"/></svg>
      <span>Telegram</span>
    </a>
  </div>

  <!-- TITLE -->
  <div class="title-wrap">
    <div class="title-glow"></div>
    <h1>Pack<br>Parsgus</h1>
  </div>


  <!-- MAIN CONTENT -->
  <div class="main-wrapper">
    <a href="https://gofile.io/d/OSeI3C" class="glass-btn" id="sfxBtn" target="_blank" rel="noopener">
      <span>SFX Design</span>
    </a>

    <a href="https://gofile.io/d/w6mie3" class="glass-btn" id="ccLineBtn" target="_blank" rel="noopener">
      <span>CC line black</span>
    </a>

    <div class="glass-btn" id="soonBtn">
      <span>Coming soon</span>
    </div>
  </div>

  <!-- spacer biar ada ruang scroll buat lihat animasi -->
  <div class="scroll-spacer"></div>

  <script>
    /* ===== SCROLL SNAP ANIMATION (toggle saat tombol lewat tengah layar) ===== */
    const sfxBtn = document.getElementById('sfxBtn');
    const ccBtn = document.getElementById('ccLineBtn');
    const soonBtn = document.getElementById('soonBtn');
    const scrollBtns = [sfxBtn, ccBtn, soonBtn];

    scrollBtns.forEach(function (btn) {
      btn.classList.add('animate-scroll', 'scrolled-in');
    });

    /* Ukur posisi ASLI elemen di dokumen pakai offsetTop (BUKAN getBoundingClientRect).
       offsetTop gak kepengaruh sama CSS transform sama sekali, jadi walaupun tombolnya
       lagi keangkat/animasi, pengukuran tetap akurat & gak "nempel" salah selamanya. */
    function getDocumentTop(el) {
      let top = 0;
      while (el) {
        top += el.offsetTop;
        el = el.offsetParent;
      }
      return top;
    }

    /* 1cm di layar HP (CSS px) kira-kira 38px. Animasi baru boleh mulai
       jalan setelah discroll minimal segini (~1.75cm), biar gak langsung
       kepicu cuma karena discroll dikit banget. */
    const SCROLL_START_THRESHOLD = 66;

    function updateScrollAnim() {
      const viewportCenter = window.innerHeight / 2;

      scrollBtns.forEach(function (btn) {
        /* selama scroll belum lewat ambang batas, paksa semua tombol
           tampil penuh -- animasi belum boleh mulai sama sekali */
        if (window.scrollY <= SCROLL_START_THRESHOLD) {
          btn.classList.add('scrolled-in');
          btn.classList.remove('scrolled-out');
          return;
        }

        const naturalTop = getDocumentTop(btn) - window.scrollY;
        const btnCenter = naturalTop + btn.offsetHeight / 2;

        if (btnCenter <= viewportCenter) {
          /* titik tengah tombol udah lewat titik tengah layar -> naik & memudar (gak sampai 0) */
          btn.classList.add('scrolled-out');
          btn.classList.remove('scrolled-in');
        } else {
          /* masih di tengah / belum sampai tengah -> tampil penuh */
          btn.classList.add('scrolled-in');
          btn.classList.remove('scrolled-out');
        }
      });
    }

    let ticking = false;
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(function () {
          updateScrollAnim();
          ticking = false;
        });
        ticking = true;
      }
    });

    window.addEventListener('resize', updateScrollAnim);
    window.addEventListener('load', updateScrollAnim);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updateScrollAnim);
    }

    updateScrollAnim();
  </script>
</body>
</html>

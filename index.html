<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .glow-box {
    width: 320px;
    height: 320px;
    border: 0.5px solid #ffffff;
    border-radius: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    text-align: center;
    box-shadow:
      0 0 4px rgba(255, 255, 255, 0.8),
      0 0 10px rgba(255, 255, 255, 0.4),
      0 0 18px rgba(255, 255, 255, 0.2);
    animation: driftBox 14s ease-in-out infinite;
    cursor: pointer;
    transition: box-shadow 0.3s ease, transform 0.2s ease;
  }

  .glow-box.active {
    box-shadow:
      0 0 8px rgba(255, 224, 102, 0.9),
      0 0 20px rgba(255, 224, 102, 0.5),
      0 0 36px rgba(255, 224, 102, 0.3);
    transform: scale(1.03);
  }

  @keyframes driftBox {
    0%   { transform: translate(0px, 0px); }
    20%  { transform: translate(6px, -4px); }
    40%  { transform: translate(-5px, 5px); }
    60%  { transform: translate(4px, 6px); }
    80%  { transform: translate(-6px, -3px); }
    100% { transform: translate(0px, 0px); }
  }

  .glow-box p {
    color: #ffffff;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.5px;
    line-height: 1.7;
    text-shadow:
      0 0 3px rgba(255, 255, 255, 0.8),
      0 0 8px rgba(255, 255, 255, 0.5),
      0 0 16px rgba(255, 255, 255, 0.3);
    animation: floatOffset 3s ease-in-out infinite;
  }

  @keyframes floatOffset {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
  }
</style>
</head>
<body>

  <div class="wrapper">
    <div class="glow-box" id="glowBox">
      <p>coming soon SFX nya<br>(yg pasti awal bulan Agustus)</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const glowBox = document.getElementById('glowBox');

      if (glowBox) {
        glowBox.addEventListener('click', function () {
          glowBox.classList.toggle('active');
        });
      }
    });
  </script>
</body>
</html>
